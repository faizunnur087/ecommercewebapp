---
- name: Deploy ecommerce to EC2
  hosts: all
  become: yes

  vars:
    app_name: ecommerce
    app_dir: /opt/ecommerce
    app_user: ubuntu
    python_entrypoint: "main:app"
    app_port: 8000

  handlers:
    - name: restart ecommerce
      systemd:
        name: ecommerce
        state: restarted
        daemon_reload: yes

    - name: reload nginx
      service:
        name: nginx
        state: reloaded

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - nginx
          - curl
          - git
        state: present

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Copy application files to host
      copy:
        src: ../
        dest: "{{ app_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Create Python virtual environment
      command: python3 -m venv "{{ app_dir }}/venv"
      args:
        creates: "{{ app_dir }}/venv"
      become: yes
      become_user: "{{ app_user }}"

    - name: Check if requirements.txt exists
      stat:
        path: "{{ app_dir }}/requirements.txt"
      register: requirements_stat

    - name: Install Python dependencies from requirements.txt
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      become: yes
      become_user: "{{ app_user }}"
      when: requirements_stat.stat.exists

    - name: Install gunicorn in virtualenv
      pip:
        name: gunicorn
        virtualenv: "{{ app_dir }}/venv"
      become: yes
      become_user: "{{ app_user }}"

    - name: Write application environment file
      shell: |
        printf '' > {{ app_dir }}/.env
        {% if db_type is defined and db_type == 'postgres' %}
        printf 'DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@localhost:5432/{{ db_name }}\n' >> {{ app_dir }}/.env
        printf 'DB_HOST=localhost\n' >> {{ app_dir }}/.env
        printf 'DB_PORT=5432\n' >> {{ app_dir }}/.env
        printf 'DB_NAME={{ db_name }}\n' >> {{ app_dir }}/.env
        printf 'DB_USER={{ db_username }}\n' >> {{ app_dir }}/.env
        printf 'DB_PASSWORD={{ db_password }}\n' >> {{ app_dir }}/.env
        {% elif db_type is defined and db_type == 'mysql' %}
        printf 'DATABASE_URL=mysql://{{ db_username }}:{{ db_password }}@localhost:3306/{{ db_name }}\n' >> {{ app_dir }}/.env
        printf 'DB_HOST=localhost\n' >> {{ app_dir }}/.env
        printf 'DB_PORT=3306\n' >> {{ app_dir }}/.env
        printf 'DB_NAME={{ db_name }}\n' >> {{ app_dir }}/.env
        printf 'DB_USER={{ db_username }}\n' >> {{ app_dir }}/.env
        printf 'DB_PASSWORD={{ db_password }}\n' >> {{ app_dir }}/.env
        {% elif db_type is defined and db_type == 'mongodb' %}
        printf 'MONGO_URL=mongodb://localhost:27017/{{ db_name }}\n' >> {{ app_dir }}/.env
        printf 'DB_NAME={{ db_name }}\n' >> {{ app_dir }}/.env
        {% endif %}
      args:
        executable: /bin/bash

    - name: Set ownership of env file
      file:
        path: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"

    - name: Check if index.html exists (static site)
      stat:
        path: "{{ app_dir }}/index.html"
      register: index_html_stat

    - name: Check if main.py exists
      stat:
        path: "{{ app_dir }}/main.py"
      register: main_py_stat

    - name: Create minimal Python app if no Python entrypoint exists
      copy:
        dest: "{{ app_dir }}/main.py"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        content: |
          import os
          from flask import Flask, send_from_directory

          app = Flask(__name__, static_folder='.')

          @app.route('/', defaults={'path': ''})
          @app.route('/<path:path>')
          def serve(path):
              if path and os.path.exists(os.path.join(app.static_folder, path)):
                  return send_from_directory(app.static_folder, path)
              return send_from_directory(app.static_folder, 'index.html')

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 8000)))
      when: not main_py_stat.stat.exists and index_html_stat.stat.exists

    - name: Install flask in virtualenv (needed for static site serving)
      pip:
        name: flask
        virtualenv: "{{ app_dir }}/venv"
      become: yes
      become_user: "{{ app_user }}"
      when: not main_py_stat.stat.exists and index_html_stat.stat.exists

    - name: Create systemd service for ecommerce
      copy:
        dest: /etc/systemd/system/ecommerce.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=ecommerce application
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart={{ app_dir }}/venv/bin/gunicorn --workers 3 --bind 0.0.0.0:{{ app_port }} {{ python_entrypoint }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: restart ecommerce

    - name: Enable and start ecommerce service
      systemd:
        name: ecommerce
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Configure nginx for ecommerce
      copy:
        dest: /etc/nginx/sites-available/ecommerce
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }
      notify: reload nginx

    - name: Enable ecommerce nginx site
      file:
        src: /etc/nginx/sites-available/ecommerce
        dest: /etc/nginx/sites-enabled/ecommerce
        state: link
      notify: reload nginx

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Install postgres if requested
      apt:
        name: postgresql
        state: present
        update_cache: yes
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'postgres'

    - name: Fix postgres SCRAM auth to md5
      shell: |
        PG_HBA=$(find /etc/postgresql -name pg_hba.conf | head -1)
        sed -i 's/scram-sha-256/md5/g' "$PG_HBA"
        systemctl reload postgresql
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'postgres'

    - name: Create postgres database
      shell: |
        sudo -u postgres psql -c "CREATE DATABASE {{ db_name }};" || true
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'postgres'

    - name: Create postgres user
      shell: |
        sudo -u postgres psql -c "CREATE USER {{ db_username }} WITH ENCRYPTED PASSWORD '{{ db_password }}';" || true
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'postgres'

    - name: Grant postgres privileges
      shell: |
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};" || true
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'postgres'

    - name: Install mysql if requested
      apt:
        name: mysql-server
        state: present
        update_cache: yes
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'mysql'

    - name: Create mysql database and user
      shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
        mysql -e "CREATE USER IF NOT EXISTS '{{ db_username }}'@'localhost' IDENTIFIED BY '{{ db_password }}';"
        mysql -e "GRANT ALL ON {{ db_name }}.* TO '{{ db_username }}'@'localhost';"
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'mysql'

    - name: Install mongodb if requested
      apt:
        name: mongodb-org
        state: present
        update_cache: yes
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'mongodb'

    - name: Start and enable mongod
      systemd:
        name: mongod
        state: started
        enabled: yes
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'mongodb'

    - name: Create mongodb database
      shell: |
        mongosh --eval 'db.getSiblingDB("{{ db_name }}").createCollection("init")'
      when: install_db is defined and install_db == 'true' and db_type is defined and db_type == 'mongodb'